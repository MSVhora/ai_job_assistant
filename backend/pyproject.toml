[project]
name = "ai-job-assistant-backend"
version = "0.1.0"
description = "AI Job Assistant backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "litellm>=1.40",
    "pgvector>=0.3",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "pyright>=1.1.380",
    "pytest-cov>=5.0",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # docstring rules: the standard asks for comments only on non-obvious decisions
    "COM812",  # trailing comma: conflicts with the formatter
    "ISC001",  # implicit string concat: conflicts with the formatter
    "CPY",     # copyright header: not wanted in a self-hosted app
    "FAST001", # the API standard requires an explicit response_model on every route
    "RUF001",  # prose and user-facing strings use typographic dashes and multiplication signs
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", "ANN", "PLR2004", "SLF001", "ARG", "INP001", "PLC0415",
    "PLR0913", "PLR0915", "PLR0917", "FBT", "S311", "A001", "DTZ011",
]
"tests/conftest.py" = ["TID251"]  # sets process env before the app is imported
"alembic/**" = ["INP001", "N999"]
"scripts/**" = ["INP001", "T201", "S311"]  # S311: seeded demo data, not security
"app/adapters/retry.py" = ["S311"]  # backoff jitter, not security
"app/services/profile_service.py" = ["PLC0415"]  # lazy gap_fill import breaks a gap_fill <-> profile_service cycle

[tool.ruff.lint.mccabe]
max-complexity = 14

[tool.ruff.lint.pylint]
max-args = 6
max-positional-args = 6
max-branches = 13
max-returns = 8

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.getenv".msg = "Read configuration through app.core.config.Settings."
"os.environ".msg = "Read configuration through app.core.config.Settings."
"openai".msg = "Call models through app.adapters.llm."
"anthropic".msg = "Call models through app.adapters.llm."
"google.generativeai".msg = "Call models through app.adapters.llm."

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.pyright]
include = ["app"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
